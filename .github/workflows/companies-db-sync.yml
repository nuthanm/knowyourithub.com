name: Companies DB Sync

permissions:
  contents: write

on:
  push:
    branches:
      - "**"
    paths:
      - data/companies.json
      - data/companies.example.json
      - data/catalog.generated.json
      - scripts/catalog-push-db.mjs
      - scripts/sync-companies-db.mjs
      - scripts/sanitize-public-data.mjs
      - scripts/migrate-verified-submissions.mjs
      - scripts/sync-review-queue-json.mjs
      - scripts/catalog-pull-db.mjs
      - db/companies.sql
      - db/submissions.sql
      - package.json
  pull_request:
    paths:
      - data/companies.json
      - data/companies.example.json
      - data/catalog.generated.json
      - scripts/catalog-push-db.mjs
      - scripts/sync-companies-db.mjs
      - scripts/sanitize-public-data.mjs
      - scripts/migrate-verified-submissions.mjs
      - scripts/sync-review-queue-json.mjs
      - scripts/catalog-pull-db.mjs
      - db/companies.sql
      - db/submissions.sql
      - package.json
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run full DB and generated-data sync workflow
        run: npm run sync:workflow
      - name: Commit sanitized JSON files back to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- data/companies.json data/pipeline.json data/drafts data/enrichments; then
            echo "No sanitization changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git add -f data/companies.json
          git commit -m "chore: sanitize public JSON after DB sync"
          git push
